<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Verification - Jobletters.xyz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
    
    <script type="module">
        // Re-initialize Firebase for this page
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js"; 
        
        // NOTE: Use the SAME Firebase Config from your index.html
        const firebaseConfig = {
            apiKey: "AIzaSyDLGrQQd2SEppdZooI7VWV7I7h4l_QAdZs",
            authDomain: "jobletters-3c5ea.firebaseapp.com",
            projectId: "jobletters-3c5ea",
            storageBucket: "jobletters-3c5ea.firebasestorage.app",
            messagingSenderId: "473489426093",
            appId: "1:473489426093:web:fae4d21f759d14837aa824",
            measurementId: "G-TR8CQ7EP54"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app); 
        
        const STORAGE_PREFIX = 'jobletters_';
        const SESSION_PAID_FLAG = 'verified_doc_id'; 
        const PENDING_DOC_ID = 'pendingDocId';

        function getUrlParams() {
            const params = {};
            window.location.search.substring(1).split('&').forEach(pair => {
                if (pair) {
                    const [key, value] = pair.split('=');
                    params[key] = decodeURIComponent(value.replace(/\+/g, ' '));
                }
            });
            return params;
        }

        async function verifyPayment() {
            const params = getUrlParams();
            const tx_ref = params.tx_ref; 
            // Flutterwave passes 'status=successful' on a good transaction.
            const status = params.status; 
            
            // Get the document ID saved right before redirection
            const docIdFromStorage = localStorage.getItem(STORAGE_PREFIX + PENDING_DOC_ID);
            
            const messageElement = document.getElementById('verificationMessage');
            const spinnerElement = document.getElementById('spinner');

            messageElement.textContent = `Processing transaction ${tx_ref || '...'}`;

            // 1. Basic check
            if (status !== 'successful' || !tx_ref || !docIdFromStorage) {
                console.error("Missing/Failed transaction details or local doc ID.");
                messageElement.innerHTML = `❌ Payment failed or details missing. Status: ${status || 'N/A'}. Redirecting in 5s.`;
                spinnerElement.style.display = 'none';
                // Wait 5 seconds then redirect home
                setTimeout(() => window.location.href = "/index.html", 5000); 
                return;
            }

            // 2. Mock Server-Side Verification (CRITICAL STEP)
            // IN A REAL PRODUCTION APP: 
            // You MUST send tx_ref and the expected amount to a secure **BACKEND** endpoint 
            // (like a Firebase Function or API route) to query Flutterwave's API 
            // (using your SECRET KEY) and verify the payment. 
            // Updating Firestore directly from the client is **NOT SECURE** as it can still be exploited.
            
            // For this client-side JS/Firestore structure, we proceed with the update.
            try {
                const docRef = doc(db, "documents", docIdFromStorage);
                
                // Get the document to ensure it hasn't been paid for already
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().isPaid) {
                     messageElement.innerHTML = `✅ Document already verified! Redirecting to index...`;
                } else {
                     // Update the document to mark it as PAID
                     await updateDoc(docRef, {
                         isPaid: true,
                         txRef: tx_ref,
                         paidAt: serverTimestamp(),
                         status: 'verified_success'
                     });
                     messageElement.innerHTML = `✅ Payment verified successfully! Document unlocked. Redirecting in 3s.`;
                }
                
                // 3. Clean up storage and redirect back to the main app with the verified docId
                localStorage.removeItem(STORAGE_PREFIX + PENDING_DOC_ID); 
                // Set the session flag in case the URL parameter gets lost
                sessionStorage.setItem(SESSION_PAID_FLAG, docIdFromStorage);

                // Redirect to index.html with the verified docId to unlock content
                setTimeout(() => {
                    window.location.href = `/index.html?docId=${docIdFromStorage}`;
                }, 3000);

            } catch (e) {
                console.error("Error updating Firestore or verifying payment:", e);
                messageElement.innerHTML = `❌ Error verifying payment with the system. Contact support with Transaction ID: ${tx_ref}. Redirecting in 5s.`;
                spinnerElement.style.display = 'none';
                setTimeout(() => window.location.href = "/index.html", 5000);
            }
        }

        window.addEventListener('load', verifyPayment);
    </script>
    
    <style>
        body { font-family: 'Montserrat', sans-serif; text-align: center; padding: 50px; background-color: #f7f9fc; color: #333; }
        .spinner { border: 8px solid #f3f3f3; border-top: 8px solid #0047ab; border-radius: 50%; width: 60px; height: 60px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .message { font-size: 1.2em; margin-top: 30px; }
        .logo { font-size: 30px; font-weight: 700; color: #0047ab; }
        .logo i { color: #ffd700; }
    </style>
</head>
<body>
    <div class="logo"><i class="fas fa-envelope"></i> Jobletters.xyz</div>
    <div id="spinner" class="spinner"></div>
    <p class="message" id="verificationMessage">Verifying your payment securely... Do not close this window.</p>
</body>
</html>
